name: Military Godot CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: military-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  military:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Verify official pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/military-ci/bootstrap" "$RUNNER_TEMP/military-ci/xdg/cache" "$RUNNER_TEMP/military-ci/xdg/config" "$RUNNER_TEMP/military-ci/xdg/data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/military-ci/xdg/cache"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/military-ci/xdg/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/military-ci/xdg/data"
          df -h "$RUNNER_TEMP" > "$RUNNER_TEMP/military-ci/bootstrap/disk.log"
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 2097152
          bash tools/ci/install_godot.sh "$RUNNER_TEMP/military-ci/engine" 2>&1 | tee "$RUNNER_TEMP/military-ci/bootstrap/install.log"
          cp "$RUNNER_TEMP/military-ci/engine/"*.txt "$RUNNER_TEMP/military-ci/bootstrap/"
      - name: Execute isolated native military tests and replays
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/ci/validate_military.py \
            --godot "$RUNNER_TEMP/military-ci/engine/Godot_v4.6.3-stable_linux.x86_64" \
            --work-dir "$RUNNER_TEMP/military-ci/project" \
            --output "$RUNNER_TEMP/military-ci/results" \
            --test-timeout 900
      - name: Add readable result summary
        if: ${{ always() }}
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/military-ci/results/summary.md"; then
            cat "$RUNNER_TEMP/military-ci/results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve only CI logs and result metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: military-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/military-ci/bootstrap/
            ${{ runner.temp }}/military-ci/results/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
